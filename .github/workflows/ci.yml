name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Domain logic (money, splits, FX, balances) needs no AWS at all.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
