# Frontend only. There is no backend yet — `amplify/` and the `backend:` phase
# come back when we add the first AWS resource.
#
# `npm ci` is not used: aws-cdk-lib and the Amplify constructs declare
# bundleDependencies, whose transitive deps npm omits from the lockfile it
# writes, so `npm ci` rejects npm's own output. That returns when those
# dependencies do; `npm install` still honours the committed lockfile.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --no-audit --no-fund --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
